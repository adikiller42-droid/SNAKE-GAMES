<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="menu">

<h1 class="title">🐍 Snake Game</h1>

<div class="level-buttons">

    <button id="level1" class="level-btn level1" onclick="startGame(1)">
        <span class="level-number">01</span>
        <span class="level-name">LEVEL 1</span>
        <span class="lock"></span>
    </button>

    <button id="level2" class="level-btn level2" onclick="startGame(2)">
        <span class="level-number">02</span>
        <span class="level-name">LEVEL 2</span>
        <span class="lock">🔒</span>
    </button>

    <button id="level3" class="level-btn level3" onclick="startGame(3)">
        <span class="level-number">03</span>
        <span class="level-name">LEVEL 3</span>
        <span class="lock">🔒</span>
    </button>

    <button id="level4" class="level-btn level4" onclick="startGame(4)">
        <span class="level-number">04</span>
        <span class="level-name">LEVEL 4</span>
        <span class="lock">🔒</span>
    </button>

    <button id="level5" class="level-btn level5" onclick="startGame(5)">
        <span class="level-number">05</span>
        <span class="level-name">LEVEL 5</span>
        <span class="lock">🔒</span>
    </button>

</div>
</div>
<div class="menuBottom">

<button onclick="showHighScore()">🏆 HIGH SCORE</button>

<button onclick="showHelp()">❓ CARA BERMAIN</button>

</div>

</div>

<div id="gameArea" style="display:none;">

    <div id="infoBar">

        <span id="levelText">LEVEL : 1</span>

        <span id="scoreText">SKOR : 0</span>

        <span id="targetText">TARGET : 10</span>

    </div>

    <canvas id="game" width="600" height="600"></canvas>

</div>
<div id="controls">
    <button onclick="up()">⬆</button>

    <div>
        <button onclick="left()">⬅</button>
        <button onclick="down()">⬇</button>
        <button onclick="right()">➡</button>
    </div>
</div>
<div id="levelComplete" style="display:none;">

    <h1>⭐ LEVEL SELESAI! ⭐</h1>

    <h2>Skor Anda : <span id="finalScore">0</span></h2>

    <button onclick="nextLevelContinue()">LANJUT</button>

    <button onclick="backToMenu()">MENU</button>

</div>
<div id="gameOver" style="display:none;">

    <h1>💀 GAME OVER</h1>

    <h2>Skor Anda : <span id="gameOverScore">0</span></h2>

    <button onclick="restartGame()">RESTART</button>

    <button onclick="backToMenu()">MENU</button>

</div>

<script src="levels.js"></script>
<script src="script.js"></script>

</body>
</html>
